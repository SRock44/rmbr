name: Publish to PyPI

# Fires when a GitHub Release is published (see RELEASING.md for the
# release process). Uses PyPI's Trusted Publishing (OIDC) - no long-lived
# API token stored in this repo, ever. Requires a one-time setup step on
# pypi.org before the first release; see RELEASING.md.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install build
      - run: python -m build

      - name: Verify the built distributions
        run: python -m pip install twine && twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing - no token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
